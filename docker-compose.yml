version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: musepath-api
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: musepath-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped